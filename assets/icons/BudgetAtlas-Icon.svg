<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">BudgetAtlas App Icon</title>
  <desc id="desc">Dark themed budget dashboard icon with donut chart and four ascending bars.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070b12"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2432"/>
      <stop offset="100%" stop-color="#0c111a"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f6cff"/>
      <stop offset="100%" stop-color="#1d3ee8"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#28e7f5"/>
      <stop offset="100%" stop-color="#00a8d6"/>
    </linearGradient>

    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7ff2f"/>
      <stop offset="100%" stop-color="#76c900"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer icon -->
  <rect x="64" y="64" width="896" height="896" rx="160"
        fill="url(#bg)" stroke="#323b4f" stroke-width="8" filter="url(#softShadow)"/>

  <!-- Inner dashboard panel -->
  <rect x="160" y="160" width="704" height="704" rx="110"
        fill="url(#panel)" stroke="#3c4659" stroke-width="6"/>

  <!-- Donut chart -->
  <g transform="translate(0 0)" filter="url(#innerGlow)">
    <circle cx="392" cy="388" r="152" fill="none" stroke="#17202d" stroke-width="82"/>

    <!-- Cyan ~52% -->
    <circle cx="392" cy="388" r="152" fill="none"
            stroke="url(#cyan)" stroke-width="82" stroke-linecap="butt"
            stroke-dasharray="497 458" stroke-dashoffset="0"
            transform="rotate(-90 392 388)"/>

    <!-- Blue ~31% -->
    <circle cx="392" cy="388" r="152" fill="none"
            stroke="url(#blue)" stroke-width="82" stroke-linecap="butt"
            stroke-dasharray="296 659" stroke-dashoffset="-514"
            transform="rotate(-90 392 388)"/>

    <!-- Lime ~17% -->
    <circle cx="392" cy="388" r="152" fill="none"
            stroke="url(#lime)" stroke-width="82" stroke-linecap="butt"
            stroke-dasharray="162 793" stroke-dashoffset="-828"
            transform="rotate(-90 392 388)"/>

    <circle cx="392" cy="388" r="94" fill="#0a0f17"/>
  </g>

  <!-- Bars -->
  <g filter="url(#innerGlow)">
    <rect x="430" y="644" width="88" height="166" rx="24" fill="url(#blue)"/>
    <rect x="540" y="590" width="88" height="220" rx="24" fill="#0b9fe8"/>
    <rect x="650" y="520" width="88" height="290" rx="24" fill="url(#cyan)"/>
    <rect x="760" y="430" width="88" height="380" rx="24" fill="url(#lime)"/>
  </g>

  <!-- Subtle highlights -->
  <path d="M215 190 H810" stroke="#ffffff" stroke-opacity="0.06" stroke-width="4" stroke-linecap="round"/>
</svg>
