<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">BudgetAtlas App Icon</title>
  <desc id="desc">Dark themed budget dashboard icon with donut chart and four ascending bars.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070b12"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2432"/>
      <stop offset="100%" stop-color="#0c111a"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f6cff"/>
      <stop offset="100%" stop-color="#1d3ee8"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#28e7f5"/>
      <stop offset="100%" stop-color="#00a8d6"/>
    </linearGradient>

    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7ff2f"/>
      <stop offset="100%" stop-color="#76c900"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer icon -->
  <rect x="0" y="0" width="1024" height="1024" rx="0"
        fill="url(#bg)" stroke="#323b4f" stroke-width="8"/>

  <!-- Inner dashboard panel -->
  <rect x="56" y="56" width="912" height="912" rx="140"
        fill="url(#panel)" stroke="#3c4659" stroke-width="6"/>

  <!-- Donut chart -->
  <g transform="translate(0 0)">
    <circle cx="350" cy="350" r="180" fill="none" stroke="#17202d" stroke-width="96"/>

    <!-- Cyan ~52% -->
    <circle cx="350" cy="350" r="180" fill="none"
            stroke="url(#cyan)" stroke-width="96" stroke-linecap="butt"
            stroke-dasharray="590 541" stroke-dashoffset="0"
            transform="rotate(-90 350 350)"/>

    <!-- Blue ~31% -->
    <circle cx="350" cy="350" r="180" fill="none"
            stroke="url(#blue)" stroke-width="96" stroke-linecap="butt"
            stroke-dasharray="350 781" stroke-dashoffset="-610"
            transform="rotate(-90 350 350)"/>

    <!-- Lime ~17% -->
    <circle cx="350" cy="350" r="180" fill="none"
            stroke="url(#lime)" stroke-width="96" stroke-linecap="butt"
            stroke-dasharray="192 939" stroke-dashoffset="-975"
            transform="rotate(-90 350 350)"/>

    <circle cx="392" cy="388" r="94" fill="#0a0f17"/>
  </g>

  <!-- Bars -->
  <g>
    <rect x="480" y="650" width="100" height="205" rx="28" fill="url(#blue)"/>
    <rect x="600" y="580" width="100" height="275" rx="28" fill="#0b9fe8"/>
    <rect x="720" y="495" width="100" height="360" rx="28" fill="url(#cyan)"/>
    <rect x="840" y="385" width="100" height="470" rx="28" fill="url(#lime)"/>
  </g>

  <!-- Subtle highlights -->
  <path d="M160 155 H864" stroke="#ffffff" stroke-opacity="0.06" stroke-width="4" stroke-linecap="round"/>
</svg>
