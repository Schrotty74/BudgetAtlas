<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">BudgetAtlas App Icon</title>
  <desc id="desc">Full-bleed budget dashboard with a donut chart and four ascending bars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17477f"/>
      <stop offset="55%" stop-color="#0d2d58"/>
      <stop offset="100%" stop-color="#07172e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#527cff"/>
      <stop offset="100%" stop-color="#2548e8"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#36e9f7"/>
      <stop offset="100%" stop-color="#06a9d8"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2ff42"/>
      <stop offset="100%" stop-color="#82cc00"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <path d="M0 810 C230 620 450 760 720 520 C850 404 942 354 1024 322 V1024 H0Z" fill="#061329" opacity="0.23"/>
  <path d="M0 82 H1024" stroke="#b8d7ff" stroke-opacity="0.13" stroke-width="8"/>
  <g>
    <circle cx="326" cy="390" r="190" fill="none" stroke="#08203c" stroke-width="108"/>
    <circle cx="326" cy="390" r="190" fill="none" stroke="url(#cyan)" stroke-width="108" stroke-dasharray="623 571" stroke-dashoffset="0" transform="rotate(-90 326 390)"/>
    <circle cx="326" cy="390" r="190" fill="none" stroke="url(#blue)" stroke-width="108" stroke-dasharray="370 824" stroke-dashoffset="-642" transform="rotate(-90 326 390)"/>
    <circle cx="326" cy="390" r="190" fill="none" stroke="url(#lime)" stroke-width="108" stroke-dasharray="201 993" stroke-dashoffset="-1032" transform="rotate(-90 326 390)"/>
    <circle cx="326" cy="390" r="108" fill="#071a33"/>
  </g>
  <g>
    <rect x="500" y="655" width="100" height="215" rx="30" fill="url(#blue)"/>
    <rect x="620" y="570" width="100" height="300" rx="30" fill="#159fde"/>
    <rect x="740" y="475" width="100" height="395" rx="30" fill="url(#cyan)"/>
    <rect x="860" y="350" width="100" height="520" rx="30" fill="url(#lime)"/>
  </g>
